<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中國附醫急診就診導覽</title>
<style>
:root{--bg:#dff3ec;--ink:#2b3a42;--card:#fff;--edge:#c3e2d4;}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#e9f8f2,#d3ede3);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
header{padding:16px 16px 4px;text-align:center}
header h1{margin:0;font-size:24px;display:flex;align-items:center;justify-content:center;gap:8px}
header h1 svg{width:1.15em;height:1.15em;flex:none;cursor:default}
header p{margin:4px 0 0;font-size:15px;color:#4a5d66}
.main{max-width:1280px;margin:0 auto;padding:8px 14px 28px}
.mapwrap{position:relative;display:flex;flex-direction:column}
.mapbox{order:3}
.mapwrap.go .info{position:relative;left:auto;bottom:auto;width:auto;max-width:none;margin-top:10px;order:4}
.mapbox{background:linear-gradient(#eef9fc,#d9eef5);border-radius:26px;border:3px solid var(--edge);box-shadow:0 6px 0 var(--edge);overflow:hidden}
svg{width:100%;height:auto;display:block;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.info{position:absolute;left:14px;bottom:16px;width:340px;max-width:calc(100% - 28px);background:#fffffff5;border:3px solid var(--edge);border-radius:18px;padding:10px 14px 12px;z-index:2;box-shadow:0 4px 0 var(--edge)}
.info h2{margin:0 26px 4px 0;font-size:16px}
#infoX{position:absolute;top:6px;right:8px;border:0;background:none;font-size:16px;cursor:pointer;padding:4px 6px;color:#6b7b83}
svg.drag{cursor:grabbing}
.rot{position:absolute;top:12px;right:12px;display:flex;gap:6px;align-items:center;z-index:2}
.rot button{font:inherit;font-weight:800;font-size:14px;border:2px solid var(--edge);background:#fff;border-radius:12px;padding:6px 10px;cursor:pointer;box-shadow:0 3px 0 var(--edge)}
.rot button:active{transform:translateY(2px);box-shadow:none}
.rothint{position:absolute;left:14px;top:12px;font-size:13px;color:#4a5d66;background:#ffffffd9;border-radius:10px;padding:4px 10px;pointer-events:none;z-index:2}
.panel{display:flex;gap:14px;margin-top:16px;align-items:stretch;flex-wrap:wrap}
.card{background:var(--card);border-radius:20px;padding:14px;border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge)}
.stepsCard{flex:1 1 560px}
.detailCard{flex:1 1 320px;min-height:120px}
.card h2{margin:0 0 8px;font-size:17px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps li{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:14px;cursor:pointer;font-size:14px;transition:.15s}
.steps li:hover{background:#eefaf5}
.steps li.on{background:#fff2c9}
.num{flex:0 0 26px;height:26px;border-radius:50%;background:#35464e;color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px}
.num.back{background:#2bb3a3}
#detail{font-size:14px;line-height:1.65}
#detail b{font-size:15px}
.modeCard{margin-bottom:14px}
.mbtns{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.ob{font:inherit;font-weight:800;font-size:14px;border:3px solid #9ec5f5;background:#fff;border-radius:14px;padding:7px 12px;cursor:pointer;box-shadow:0 3px 0 #9ec5f5}
.ob.on{background:#d6e8ff;box-shadow:none;transform:translateY(2px)}
.mb{font:inherit;font-weight:800;font-size:16px;text-align:left;border:3px solid #9fd0bb;background:#fff;border-radius:16px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;line-height:1.3;box-shadow:0 4px 0 #9fd0bb;transition:.12s}
.mb small{font-size:13px;font-weight:600;color:#5b6b73}
.mb:hover{transform:translateY(-2px)}
.mb.on{background:#ffe3d3;border-color:#ff9a6b;transform:translateY(2px);box-shadow:none}
.subRow{margin-top:12px;padding-top:12px;border-top:2px dashed var(--edge);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media(max-width:699px){.mbtns{grid-template-columns:1fr 1fr}.mb{font-size:14px;padding:10px}}
.zoneBar{margin-top:16px}
.zbtns{display:flex;gap:10px;flex-wrap:wrap}
.zb{font:inherit;font-weight:800;font-size:16px;border:3px solid var(--c,#ccc);background:#fff;border-radius:16px;padding:8px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25;box-shadow:0 4px 0 var(--c,#ccc);transition:.12s}
.zb small{font-size:13px;font-weight:600;color:#5b6b73}
.zb:hover{transform:translateY(-2px)}
.zb.on{background:var(--c);transform:translateY(2px);box-shadow:none}
.zb.clr{--c:#cfd8dc;font-size:14px;justify-content:center}
#routeTxt{margin-top:12px;font-size:14px;line-height:1.7}
#routeTxt ol{margin:6px 0 0;padding-left:0;list-style:none}
#routeTxt li{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
#routeTxt .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--zc);color:#35464e;font-weight:800;display:grid;place-items:center;font-size:13px;margin-top:1px}
#routeTxt .hl{display:block;background:#fff2c9;border-radius:12px;padding:8px 10px}
.nextBar{margin-top:12px;padding-top:12px;border-top:2px dashed var(--edge);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nb{font:inherit;font-weight:800;font-size:14px;border:3px solid #ff9ec4;background:#fff;border-radius:14px;padding:7px 14px;cursor:pointer;box-shadow:0 3px 0 #ff9ec4}
.nb.on{background:#ffd3e4;box-shadow:none;transform:translateY(2px)}
.tip{font-size:13px;color:#5b6b73;line-height:1.5;margin:12px 4px 0;text-align:center}
/* svg */
.room,.lbl{transition:transform .18s}
.room{cursor:pointer}
.room.hov,.lbl.hov{transform:translateY(-3px)}
.room.sel,.lbl.sel{transform:translateY(-5px)}
.room.sel polygon.top{stroke:#ff6a3d;stroke-width:4}
.lbl{pointer-events:none}
.t{font-weight:800;fill:#35464e;paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round;text-anchor:middle}
.ic{text-anchor:middle}
.pin{cursor:pointer}
.bob{animation:bob 1.6s ease-in-out infinite}
.pin.sel .bob,.bob.fast{animation:bob .6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.wbob{animation:wbob .45s ease-in-out infinite}
@keyframes wbob{50%{transform:translateY(-4px)}}
.pin circle{stroke:#fff;stroke-width:3}
.pin text{fill:#fff;font-weight:800;font-size:18px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
#walkers,#routeG{pointer-events:none}
/* 手機：提示在地圖上方、說明卡在地圖正下方、旋轉按鈕縮小 */
@media(max-width:699px){
  .mapwrap{display:flex;flex-direction:column}
  .rothint{left:10px;top:10px;font-size:12px;padding:3px 9px}
  .rot{top:8px;right:8px;gap:6px}
  .rot button{width:40px;height:40px;padding:0;border-radius:50%;font-size:19px;line-height:1;display:grid;place-items:center}
  .rot .rl{display:none}
  .mapbox{order:3}
  .info{position:relative;left:auto;bottom:auto;width:auto;max-width:none;margin-top:10px;order:4}
  /* 第一屏壓矮一點，讓地圖早點出現 */
  header{padding:10px 12px 2px}
  header h1{font-size:20px}
  .steps{grid-template-columns:1fr 1fr}
  header p{font-size:13px;margin-top:2px}
  .main{padding:6px 10px 24px}
  .modeCard{padding:10px;margin-bottom:10px}
  .modeCard h2{font-size:15px;margin-bottom:6px}
  .mbtns{gap:7px}
  .mb{padding:7px 10px;border-radius:14px;box-shadow:0 3px 0 #9fd0bb;gap:0}
  .mb small{font-size:12px}
}
</style>
</head>
<body>
<header>
  <h1><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" fill="#2bb3a3"/><path d="M12 6v12M6 12h12" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>中國附醫急診就診導覽</h1>
  <p>先按下面最符合您現在狀況的按鈕，地圖會一段一段帶您走；也可以點選地圖上的房間或編號看說明。</p>
</header>
<div class="main">
  <div class="card modeCard"><h2>👋 你現在的狀況是？按一個，地圖會帶你走</h2>
    <div class="mbtns">
      <button class="mb" data-m="arrive">🚪 剛到急診<small>還沒給護理師看過</small></button>
      <button class="mb" data-m="zone">🧭 去看診區<small>護理師說我去某一區</small></button>
      <button class="mb" data-m="next">💉 打針、照 X 光<small>醫師叫我去的檢查</small></button>
      <button class="mb" data-m="pay">💰 結帳離開<small>看完了：櫃台 → 出口</small></button>
      <button class="mb" data-m="wc">🚻 找廁所<small>帶我去最近的廁所</small></button>
      <button class="mb" data-m="obs">🛏️ 去留觀區<small>醫師安排留下觀察</small></button>
    </div>
    <div class="subRow" id="zoneRow" style="display:none"><b id="zoneQ">護理師說你去哪一區？</b>
      <div class="zbtns">
        <button class="zb" data-z="A" style="--c:#7cc0f2">A 區<small>外傷</small></button>
        <button class="zb" data-z="B" style="--c:#ffe066">B 區</button>
        <button class="zb" data-z="D" style="--c:#8fd9b6">D 區</button>
        <button class="zb" data-z="E" style="--c:#ffc36b">E 區</button>
        <button class="zb" data-z="P" style="--c:#ffd062">P 區<small>小兒急診</small></button>
        <button class="zb" id="zUnk" style="--c:#cfd8dc;font-size:14px">我不確定<small>在哪一區</small></button>
      </div></div>
    <div class="subRow" id="nextRow" style="display:none"><b>醫師請你去哪裡？</b>
      <div class="zbtns">
        <button class="nb" data-n="inj">💉 抽血／打針</button>
        <button class="nb" data-n="xray">🩻 照 X 光</button>
      </div></div>
    <div class="subRow" id="wcRow" style="display:none"><b>你現在在哪裡？（也可以直接點地圖上你的位置）</b>
      <div class="zbtns">
        <button class="ob" data-o="door">急診入口</button>
        <button class="ob" data-o="triage">檢傷站</button>
        <button class="ob" data-o="pay">急診批價櫃台</button>
        <button class="ob" data-o="wait">候診區</button>
        <button class="ob" data-o="A">A 區</button>
        <button class="ob" data-o="B">B 區</button>
        <button class="ob" data-o="D">D 區</button>
        <button class="ob" data-o="E">E 區</button>
        <button class="ob" data-o="P">小兒急診</button>
        <button class="ob" data-o="xray">X光室</button>
        <button class="ob" data-o="ent">五官科診療區</button>
        <button class="ob" data-o="elev">電梯前面</button>
        <button class="ob" data-o="obsO">留觀區</button>
        <button class="ob" id="wcUnk" style="border-color:#cfd8dc;box-shadow:0 3px 0 #cfd8dc">我不知道我在哪</button>
      </div></div>
    <button class="zb clr" id="zclr" style="display:none;margin-top:12px">✕ 清除路線，重新選</button>
  </div>
  <div class="mapwrap">
    <div class="rothint">↔️ 左右拖曳地圖可旋轉</div>
    <div class="info" id="info"><button id="infoX" aria-label="關閉說明">✕</button><h2 id="dt">點選站點</h2><div id="detail">點地圖上的房間或編號，這裡會顯示說明。</div></div>
    <div class="rot">
      <button id="rotL" title="把地圖向左旋轉" aria-label="地圖左旋">⟲<span class="rl"> 地圖左旋</span></button>
      <button id="rotR" title="把地圖向右旋轉" aria-label="地圖右旋"><span class="rl">地圖右旋 </span>⟳</button>
      <button id="rot0" title="地圖回到預設角度" aria-label="地圖回正">⌂<span class="rl"> 地圖回正</span></button>
    </div>
    <div class="mapbox"><svg id="map" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
      <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="12"/></filter><filter id="drop" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#2b5d4a" flood-opacity=".22"/></filter></defs>
      <g id="world"></g>
      <g id="routeG"></g>
      <g id="labels"></g>
      <g id="walkers"></g>
      <g id="pins"></g>
      <g id="topG" style="pointer-events:none"></g>
    </svg></div>
  </div>
  <div class="card" id="routeCard" style="display:none;margin-top:16px"><div id="routeTxt"></div></div>
  <div class="panel">
    <div class="card stepsCard"><h2>🗺️ 看診流程（點一下，看這一站在地圖上的哪裡）</h2><ol class="steps" id="steps"></ol></div>
  </div>
  <p class="tip">※ 示意圖，實際動線與流程請依院內護理人員及標示指引。</p>
</div>
<script>
const NS="http://www.w3.org/2000/svg";
/* ---------- 投影（可旋轉） ---------- */
let K=0.58, KT=0.58;            // 俯視程度：0.58＝立體斜視，0.9＝鳥瞰
const S_=0.76, OX=640, OY=392, CX=480, CY=505, DEF_ANG=window.innerWidth<700?18:28, HS=0.42;   // 手機轉正一點，小島才放得大
let ang=DEF_ANG, target=DEF_ANG, cA=1, sA=0;
function setAng(a){cA=Math.cos(a*Math.PI/180);sA=Math.sin(a*Math.PI/180)}
const P=(x,y,z=0)=>{const dx=x-CX,dy=y-CY;return [(dx*cA-dy*sA)*S_+OX,(dx*sA+dy*cA)*K*S_+OY-z]};
const ZH=z=>z<=5?z:5+(z-5)*HS;               // 方塊高度壓低
const pts=a=>a.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const m=v=>Math.max(0,Math.min(255,Math.round(v*f)));return `rgb(${m(r)},${m(g)},${m(b)})`}
const $=id=>document.getElementById(id);
const svg=$("map"),world=$("world"),labels=$("labels"),pinsG=$("pins"),routeG=$("routeG"),walkersG=$("walkers"),topG=$("topG");
function el(tag,attrs,parent,html){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(html!=null)e.innerHTML=html;parent.appendChild(e);return e}
// 圓角方塊的外框（平面座標，順時針）
function outline(x,y,w,h,r){
  if(r<=0.5)return [[x+w,y],[x+w,y+h],[x,y+h],[x,y]];
  const o=[],N=3;
  [[x+w-r,y+r,-90],[x+w-r,y+h-r,0],[x+r,y+h-r,90],[x+r,y+r,180]].forEach(c=>{
    for(let k=0;k<=N;k++){const t=(c[2]+90*k/N)*Math.PI/180;o.push([c[0]+r*Math.cos(t),c[1]+r*Math.sin(t)])}});
  return o;
}
// r＝圓角半徑，ins＝往內縮（讓相鄰方塊之間留一點縫）
function box(parent,x,y,w,h,z,color,z0=0,r=0,ins=0){
  ins=Math.min(ins,Math.min(w,h)*.15);x+=ins;y+=ins;w-=2*ins;h-=2*ins;r=Math.min(r,Math.min(w,h)/2-.5);
  const o=outline(x,y,w,h,r),n=o.length,st=shade(color,.6);
  const T=o.map(p=>P(p[0],p[1],z)),B=o.map(p=>P(p[0],p[1],z0)),vis=[];
  for(let i=0;i<n;i++){const j=(i+1)%n,dx=o[j][0]-o[i][0],dy=o[j][1]-o[i][1],L=Math.hypot(dx,dy)||1,nx=dy/L,ny=-dx/L;
    const v=nx*sA+ny*cA>0.001;vis.push(v);                 // 朝向觀看者的側面才畫
    if(v){const f=shade(color,.72+.14*ny*ny);el("polygon",{points:pts([T[i],T[j],B[j],B[i]]),fill:f,stroke:f,"stroke-width":.8,"stroke-linejoin":"round"},parent)}}
  let s0=-1;for(let i=0;i<n;i++)if(vis[i]&&!vis[(i-1+n)%n]){s0=i;break}
  if(s0>=0){const e=[T[s0]];let i=s0;while(vis[i]){e.push(B[i]);i=(i+1)%n;if(i===s0)break}e.push(B[i],T[i]);
    el("polyline",{points:pts(e),fill:"none",stroke:st,"stroke-width":1.5,"stroke-linejoin":"round","stroke-linecap":"round"},parent)}
  el("polygon",{points:pts(T),fill:color,stroke:st,"stroke-width":1.5,"stroke-linejoin":"round",class:"top"},parent);
}
/* ---------- 房間 ---------- */
const R=[
 {id:"consult",x:35,y:0,w:70,h:155,z:26,c:"#d9d3f3",t:"諮詢討論室",v:1,fs:13,d:"諮詢與討論空間。"},
 {id:"peds",x:196,y:0,w:429,h:150,z:28,c:"#ffe08a",t:"小兒急診（P區）",i:"🧒",fs:20,d:"兒童專屬的急診就醫區。"},
 {id:"pedsclinic",x:108,y:92,w:88,h:58,z:24,c:"#ffd062",t:"兒科診療區",fs:11,d:"兒科診療區。"},
 {id:"fast",x:185,y:158,w:82,h:82,z:24,c:"#c6ecdb",t:"快速診療室",i:"⚡",fs:13,d:"症狀較輕者的快速診療室。"},
 {id:"head",x:268,y:236,w:78,h:59,z:22,c:"#d9d3f3",t:"護理長室",fs:12},
 {id:"ent",x:348,y:158,w:222,h:135,z:26,c:"#c6ecdb",t:"五官科診療區",i:"👂",fs:18,d:"五官科診療區。"},
 {id:"elev",x:572,y:158,w:52,h:135,z:22,c:"#dfe8ec",t:"電梯",i:"🛗",v:1,fs:13,d:"電梯，在五官科診療區旁邊。"},
 {id:"stair",x:668,y:108,w:56,h:62,z:18,c:"#dfe8ec",t:"樓梯",i:"🪜",fs:13,d:"樓梯，在電梯再往裡面。"},
 {id:"wc",x:690,y:233,w:62,h:62,z:18,c:"#cfe3ff",t:"廁所",i:"🚻",fs:13,d:"<b>廁所</b>，緊鄰五官科前面的走道，過了電梯再往前一小段。不確定怎麼走時，請問現場的護理人員或志工。"},
 {id:"vip",x:800,y:0,w:140,h:290,z:44,c:"#f6cfe8",t:"留觀區",i:"🛏️",fs:18,d:"<b>留觀區</b>：需要留下來觀察的病人，依護理人員指示到這裡。"},
 {id:"wait",x:35,y:160,w:80,h:270,z:24,c:"#ffe08a",t:"候診區",i:"🪑",v:1,fs:17,d:"位於<b>急診大廳</b>內。完成掛號後，在這裡坐著等候叫號。"},
 {id:"guard",x:253,y:350,w:110,h:52,z:22,c:"#d9d3f3",t:"保護室",fs:13},
 {id:"xray",x:765,y:355,w:100,h:181,z:24,c:"#bfe3fb",t:"X光室",i:"🩻",fs:17,d:"醫師開立 X 光檢查時，直接到這裡報到、拍攝。<b>有兩個門</b>：一個在五官科前面的走道上，一個靠診療區這一側。"},

  if(Math.abs(KT-K)>0.004){K+=(KT-K)*0.22;dirty=true}else if(K!==KT){K=KT;dirty=true}
  if(dirty){render();dirty=false}
  const t=now/1000;
  walkers.forEach(w=>{let d=(t*w.sp+w.off)%(2*w.p.L);if(d>w.p.L)d=2*w.p.L-d;const q=at(w.p,d);const s=P(q[0],q[1],6);
    w.g.setAttribute("transform",`translate(${s[0].toFixed(1)},${s[1].toFixed(1)})`)});
  if(RT){
    const gk=RT.key;
    if(guideZone!==gk){guideZone=gk;guidePath=mkPath(RT.pts)}
    if(guidePath.L<100)guide.style.display="none";
    else{const d=((now-guideT0)/1000*75)%(guidePath.L+90);const q=at(guidePath,d);const s=P(q[0],q[1],7);
      guide.style.display="";guide.setAttribute("transform",`translate(${s[0].toFixed(1)},${s[1].toFixed(1)})`);}
  }else{guide.style.display="none";guideZone=null}
  requestAnimationFrame(frame);
}
/* ---------- 旋轉控制 ---------- */
$("rotL").onclick=()=>{target+=30};
$("rotR").onclick=()=>{target-=30};
$("rot0").onclick=()=>{let d=((DEF_ANG-ang)%360+540)%360-180;target=ang+d};
let drag=null;
svg.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;drag={x:e.clientX,a:ang,on:false,id:e.pointerId}});
window.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x;
  if(!drag.on&&Math.abs(dx)>5){drag.on=true;svg.classList.add("drag");try{svg.setPointerCapture(drag.id)}catch(_){}}
  if(drag.on){ang=target=drag.a-dx*0.35;dirty=true;e.preventDefault()}});
window.addEventListener("pointerup",()=>{if(drag&&drag.on){svg.classList.remove("drag");justDragged=true;setTimeout(()=>{justDragged=false},60)}drag=null});
window.addEventListener("pointercancel",()=>{svg.classList.remove("drag");drag=null});
svg.addEventListener("dragstart",e=>e.preventDefault());
show(`第 1 站｜${S[0].t}`,S[0].d);
requestAnimationFrame(frame);
</script>
