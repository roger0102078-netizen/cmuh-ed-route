<style>

header{padding:16px 16px 4px;text-align:center}
header h1{margin:0;font-size:24px}
header p{margin:4px 0 0;font-size:13px;opacity:.7}
.main{max-width:1280px;margin:0 auto;padding:8px 14px 28px}
.mapwrap{position:relative}
.mapbox{background:#f7fffb;border-radius:26px;border:3px solid var(--edge);box-shadow:0 6px 0 var(--edge);overflow-x:auto}
svg{width:100%;min-width:760px;height:auto;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
svg.drag{cursor:grabbing}
.rot{position:absolute;top:12px;right:12px;display:flex;gap:6px;align-items:center;z-index:2}
.rot button{font:inherit;font-weight:800;font-size:14px;border:2px solid var(--edge);background:#fff;border-radius:12px;padding:6px 10px;cursor:pointer;box-shadow:0 3px 0 var(--edge)}
.rot button:active{transform:translateY(2px);box-shadow:none}
.rothint{position:absolute;left:14px;top:12px;font-size:12px;background:#ffffffcc;border-radius:10px;padding:4px 10px;opacity:.8;pointer-events:none;z-index:2}
.panel{display:flex;gap:14px;margin-top:16px;align-items:stretch;flex-wrap:wrap}
.card{background:var(--card);border-radius:20px;padding:14px;border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge)}
.stepsCard{flex:1 1 560px}
.detailCard{flex:1 1 320px;min-height:120px}
.card h2{margin:0 0 8px;font-size:17px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.steps li{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:14px;cursor:pointer;font-size:14px;transition:.15s}
.steps li:hover{background:#eefaf5}
.steps li.on{background:#fff2c9}
.num{flex:0 0 26px;height:26px;border-radius:50%;background:#ff8a5c;color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px}
.num.back{background:#2bb3a3}
#detail{font-size:14px;line-height:1.65}
#detail b{font-size:15px}
.zoneBar{margin-top:16px}
.zbtns{display:flex;gap:10px;flex-wrap:wrap}
.zb{font:inherit;font-weight:800;font-size:16px;border:3px solid var(--c,#ccc);background:#fff;border-radius:16px;padding:8px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25;box-shadow:0 4px 0 var(--c,#ccc);transition:.12s}
.zb small{font-size:12px;font-weight:600;opacity:.7}
.zb:hover{transform:translateY(-2px)}
.zb.on{background:var(--c);transform:translateY(2px);box-shadow:none}
.zb.clr{--c:#cfd8dc;font-size:14px;justify-content:center}
#routeTxt{margin-top:12px;font-size:14px;line-height:1.7}
#routeTxt ol{margin:6px 0 0;padding-left:0;list-style:none}
#routeTxt li{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
#routeTxt .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--zc);color:#35464e;font-weight:800;display:grid;place-items:center;font-size:13px;margin-top:1px}
#routeTxt .hl{background:#fff2c9;border-radius:12px;padding:6px 8px}
.nextBar{margin-top:12px;padding-top:12px;border-top:2px dashed var(--edge);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nb{font:inherit;font-weight:800;font-size:14px;border:3px solid #ff9ec4;background:#fff;border-radius:14px;padding:7px 14px;cursor:pointer;box-shadow:0 3px 0 #ff9ec4}
.nb.on{background:#ffd3e4;box-shadow:none;transform:translateY(2px)}
.tip{font-size:12px;opacity:.65;line-height:1.5;margin:12px 4px 0;text-align:center}
/* svg */
.room,.lbl{transition:transform .18s}
.room{cursor:pointer}
.room.hov,.lbl.hov{transform:translateY(-3px)}
.room.sel,.lbl.sel{transform:translateY(-5px)}
.room.sel polygon.top{stroke:#ff6a3d;stroke-width:4}
.lbl{pointer-events:none}
.t{font-weight:800;fill:#35464e;paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round;text-anchor:middle}
.ic{text-anchor:middle}
.pin{cursor:pointer}
.bob{animation:bob 1.6s ease-in-out infinite}
.pin.sel .bob,.bob.fast{animation:bob .6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.wbob{animation:wbob .45s ease-in-out infinite}
@keyframes wbob{50%{transform:translateY(-4px)}}
.pin circle{stroke:#fff;stroke-width:3}
.pin text{fill:#fff;font-weight:800;font-size:18px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
#walkers,#routeG{pointer-events:none}
</style>

function sorted(){
  const dep=r=>(r.x+r.w/2-CX)*sA+(r.y+r.h/2-CY)*cA;
  const before=(a,b)=>{
    let s=0,sep=false;
    if(a.y+a.h<=b.y+1){s+=cA*(b.y-a.y-a.h+2);sep=true} else if(b.y+b.h<=a.y+1){s-=cA*(a.y-b.y-b.h+2);sep=true}

    if(sep)return Math.abs(s)<1e-6?null:s>0;

const isAB=L=>L==="A"||L==="B";
const ZINFO={
 A:{c:"#7cc0f2",x:316,y:668,name:"A 區（外傷區）",go:"沿診療區旁走到 <b>A、B 區與急救區（C區）之間的走道</b>，走道上第一區就是 <b>A 區</b>，<b>紫色框</b>是看診區。"},
 D:{c:"#8fd9b6",x:316,y:452,name:"D 區（非外傷區）",go:"走進<b>保護室與 D、E 區之間的走道</b>，走道上第一區就是 <b>D 區</b>，<b>紫色框</b>是看診區。"},
 B:{c:"#ffe066",x:573,y:668,name:"B 區（非外傷區）",go:"沿診療區旁走到 <b>A、B 區與急救區（C區）之間的走道</b>，沿走道<b>經過 A 區</b>後就是 <b>B 區</b>，<b>紫色框</b>是看診區。"},
 E:{c:"#ffc36b",x:573,y:452,name:"E 區（非外傷區）",go:"走進<b>保護室與 D、E 區之間的走道</b>，沿走道<b>經過 D 區</b>後就是 <b>E 區</b>，<b>紫色框</b>是看診區。"}
};
R.filter(r=>r.sub).forEach(r=>{const L=r.t;r.d=`<b>${ZINFO[L].name}</b>`});
const injOf=L=>(L==="A"||L==="B")?"injAB":"injDE";
// 目前要顯示的路線：來程（入口→分區），或看診後（分區→抽血注射區／X光室）
function zonePts(L){const Z=ZINFO[L];
  if(st.next==="inj"){const yy=isAB(L)?665:455,ex=(L==="A"||L==="D")?472:528;
    return [[Z.x+(ex<500?30:-30),yy],[ex,yy]];}   // 在區內直接走到交界處的注射區
  if(st.next==="xray")return isAB(L)
    ?[[Z.x,Z.y],[Z.x,SY],[736,SY],[736,600],[755,600],[755,400]]
    :[[Z.x,Z.y],[Z.x,NY],[755,NY],[755,400]];
  return COMMON.concat(isAB(L)
    ?[[200,600],[264,600],[264,SY],[Z.x,SY],[Z.x,Z.y]]
    :[[200,NY],[Z.x,NY],[Z.x,Z.y]]);}
const destId=()=>st.next==="inj"?injOf(st.zone):(st.next==="xray"?"xray":"z"+st.zone);
/* ---------- 狀態 ---------- */
const st={step:1,room:"in1",zone:null,next:null};
/* ---------- 繪製 ---------- */
function render(){
  setAng(ang);
  world.innerHTML="";labels.innerHTML="";pinsG.innerHTML="";
  box(world,-30,-26,1030,1096,0,"#9bd6b0",-18);
  box(world,-8,-8,986,1060,3,"#eef8f1");
  box(world,253,405,492,310,5,"#fff1c9");
  box(world,28,152,225,808,5,"#ffdcbf");
  const rg=el("g",{filter:"url(#drop)"},world);
  sorted().forEach(r=>{
    const g=el("g",{class:"room","data-id":r.id},rg);
    box(g,r.x,r.y,r.w,r.h,ZH(r.z),r.c,r.z0!=null?ZH(r.z0):5);
    if(r.fr){const [fx,fy,fw,fh]=r.fr,z=ZH(r.z),col=r.frc||PURPLE;
      el("polygon",{points:pts([P(fx,fy,z),P(fx+fw,fy,z),P(fx+fw,fy+fh,z),P(fx,fy+fh,z)]),fill:col,"fill-opacity":.12,stroke:col,"stroke-width":3.5,"stroke-linejoin":"round"},g);}
    g.addEventListener("click",()=>selRoom(r));
    g.addEventListener("mouseenter",()=>hov(r.id,1));
    g.addEventListener("mouseleave",()=>hov(r.id,0));
  });
  // 地板文字
  {const [x,y]=P(185,372,5);["急診","大廳"].forEach((s,k)=>el("text",{x,y:y+k*30,"font-size":27,class:"t",style:"fill:#d9692f"},labels,s));}
  R.forEach(mkLabel);
  S.forEach(s=>{
    const [x,y]=P(s.f[0],s.f[1],ZH(s.zt)+40);
    const col=s.back?'#2bb3a3':'#ff7a45';
    const g=el("g",{class:"pin","data-n":s.n,transform:`translate(${x.toFixed(1)},${y.toFixed(1)})`},pinsG,
      `<g class="bob"><path d="M-7 12 L0 26 L7 12Z" fill="${col}"/><circle r="17" fill="${col}"/><text>${s.n}</text></g>`);
    g.addEventListener("click",()=>selStep(s));
  });
  drawRoute();applyState();
}
function mkLabel(r){
  if(r.nolabel&&!r.i)return;
  const [cx,cy]=P(r.x+r.w/2,r.y+r.h/2,ZH(r.z));
  const g=el("g",{class:"lbl","data-id":r.id},labels);
  const fs=r.fs||14;
  if(r.sub){
    el("text",{x:cx,y:cy+fs*0.30,"font-size":fs,class:"t",style:"fill:"+shade(r.c,.55)},g,r.t);
    el("text",{x:cx,y:cy+fs*0.30+20,"font-size":14,class:"t"},g,r.tag);
    const [qx,qy]=P(r.fr[0]+r.fr[2]/2,r.fr[1]+r.fr[3]/2,ZH(r.z));
    el("text",{x:qx,y:qy+4,"font-size":11,class:"t",style:"fill:"+PURPLE},g,"看診區");
    return;}
  if(r.v){
    const chars=[...r.t];const step=fs+2;
    let y=cy-(chars.length*step)/2+step*.6+(r.i?8:0);
    if(r.i)el("text",{x:cx,y:y-step-2,"font-size":fs+5,class:"ic"},g,r.i);
    chars.forEach((c,k)=>el("text",{x:cx,y:y+k*step,"font-size":fs,class:"t"},g,c));
    return;}
  const span=(Math.abs(r.w*cA)+Math.abs(r.h*sA))*S_;
  const maxC=Math.max(4,Math.floor(span/fs));
  let lines=[r.t];
  if(r.t&&r.t.length>maxC){const m=Math.ceil(r.t.length/2);lines=[r.t.slice(0,m),r.t.slice(m)]}
  const lh=fs+3;
  let y=cy+fs*.35-((lines.length-1)*lh)/2+(r.i&&r.t?2:0);
  if(r.i)el("text",{x:cx,y:(r.t?y-(lines.length>1?lh*.5:0)-fs-3:cy+fs*.4),"font-size":fs+(r.t?7:0),class:"ic"},g,r.i);
  lines.forEach((t,k)=>el("text",{x:cx,y:y+k*lh+(r.i&&r.t&&lines.length>1?lh*.5:0),"font-size":fs,class:"t",style:r.lc?"fill:"+r.lc:""},g,t));
}
function drawRoute(){
  routeG.innerHTML="";
  if(!st.zone)return;
  const sp=zonePts(st.zone).map(p=>P(p[0],p[1],7));
  const d="M"+sp.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L");
  el("path",{d,fill:"none",stroke:"#fff","stroke-width":17,"stroke-linecap":"round","stroke-linejoin":"round",opacity:.95},routeG);
  el("path",{d,fill:"none",stroke:"#ff7a45","stroke-width":10,"stroke-linecap":"round","stroke-linejoin":"round"},routeG);
  let acc=0,next=22;
  for(let i=1;i<sp.length;i++){
    const [x0,y0]=sp[i-1],[x1,y1]=sp[i];const L2=Math.hypot(x1-x0,y1-y0);if(L2<.01)continue;
    const a=Math.atan2(y1-y0,x1-x0)*180/Math.PI;
    while(next<=acc+L2){const t=(next-acc)/L2;
      el("path",{d:"M-4 -5 L4 0 L-4 5",fill:"none",stroke:"#fff","stroke-width":3,"stroke-linecap":"round","stroke-linejoin":"round",
        transform:`translate(${(x0+(x1-x0)*t).toFixed(1)},${(y0+(y1-y0)*t).toFixed(1)}) rotate(${a.toFixed(1)})`},routeG);
      next+=32;}
    acc+=L2;
  }
  const zr=byId[destId()];const [tx,ty]=P(zr.x+zr.w/2,zr.y+zr.h/2,ZH(zr.z)+52);
  el("g",{transform:`translate(${tx.toFixed(1)},${ty.toFixed(1)})`},routeG,
    `<g class="bob fast"><path d="M-8 12 L0 28 L8 12Z" fill="#e8523a"/><circle r="19" fill="#e8523a" stroke="#fff" stroke-width="3"/><text text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="800" fill="#fff">到了</text></g>`);
}
function hov(id,on){document.querySelectorAll(`[data-id="${id}"]`).forEach(e=>e.classList.toggle("hov",!!on))}
function applyState(){
  document.querySelectorAll(".sel,.on").forEach(e=>e.classList.remove("sel","on"));
  if(st.step){const p=document.querySelector(`.pin[data-n="${st.step}"]`);if(p)p.classList.add("sel");
    document.querySelector(`.steps li[data-n="${st.step}"]`).classList.add("on");}
  if(st.room)document.querySelectorAll(`[data-id="${st.room}"]`).forEach(e=>e.classList.add("sel"));
  if(st.zone)document.querySelector(`.zb[data-z="${st.zone}"]`).classList.add("on");
}
function show(t,d){$("dt").textContent=t;$("detail").innerHTML=d}
function selStep(s){st.step=s.n;st.room=s.room||(st.zone?"z"+st.zone:null);applyState();show(`第 ${s.n} 站｜${s.t}`,s.d)}
function selRoom(r){
  if(r.sub){showZone(r.t);return}
  const s=S.find(s=>s.room===r.id);
  if(s&&!st.zone){selStep(s);return}
  st.step=null;st.room=r.id;applyState();
  show(r.t||"空間",r.d||"此區域不在一般就診動線上。");
}
function showZone(L){
  st.zone=L;st.next=null;routeView();}
function setNext(n){st.next=n;routeView();}
function routeView(){
  const L=st.zone,Z=ZINFO[L];st.step=null;st.room=destId();guideT0=performance.now();
  drawRoute();applyState();
  const t=$("routeTxt");t.style.setProperty("--zc",Z.c);t.style.display="block";
  const nextBar=`<div class="nextBar"><b>看完診後，醫師請你去：</b>
    <button class="nb ${st.next==='inj'?'on':''}" onclick="setNext('inj')">💉 抽血／打針</button>
    <button class="nb ${st.next==='xray'?'on':''}" onclick="setNext('xray')">🩻 照 X 光</button>
    ${st.next?`<button class="nb" onclick="setNext(null)">↩ 看回來程路線</button>`:""}</div>`;
  const list=(title,arr)=>`<b>${title}</b><ol>`+arr.map((s,i)=>`<li><span class="n">${i+1}</span><span>${s}</span></li>`).join("")+"</ol>";
  if(st.next==="inj"){
    const pair=(L==="A"||L==="B")?"A 區與 B 區":"D 區與 E 區";guideT0=performance.now();
    t.innerHTML=list(`從 ${Z.name} 去抽血／打針，這樣走：`,[
      `看完診後，留在 <b>${L} 區</b>內，往<b>${pair}的交界處</b>走。`,
      `交界處的<b>紅色框</b>就是<b>注射區</b>，不需要走出 ${L} 區。`,
      `<span class="hl">📍 抵達注射區，把單子交給護理人員，等候抽血或打針。</span>`,
      `完成後依護理人員指示，回 <b>${L} 區</b>等候結果，或到<b>急診批價</b>結帳。`])+nextBar;
    show("注射區",byId[injOf(L)].d);return;}
  if(st.next==="xray"){
    t.innerHTML=list(`從 ${Z.name} 去照 X 光，這樣走：`,[
      `看完診後，從 <b>${L} 區</b>的看診區走回旁邊的<b>走道</b>（${isAB(L)?"A、B 區與急救區之間":"保護室與 D、E 區之間"}）。`,
      `沿走道往<b>檢查區</b>方向直走到底，走出診療區。`,
      `轉進檢查室前的走道，往前就是 <b>X光室</b>。`,
      `<span class="hl">📍 抵達 X光室，依現場人員指示報到、檢查（低劑量快速掃描室就在隔壁）。</span>`,
      `檢查完成後，沿原路回 <b>${L} 區</b>，等醫師說明結果。`])+nextBar;
    show("X光室",byId.xray.d);return;}
  const steps=[
   "從<b>急診入口</b>進入<b>急診大廳</b>，往前走到<b>檢傷站</b>，由護理人員評估。",
   "在<b>急診大廳</b>的<b>急診批價</b>櫃台完成掛號。",
   "到大廳的<b>候診區</b>，坐著等候叫號。",
   "被叫到後，從<b>急診大廳</b>往<b>診療區</b>走。",
   Z.go,
   `<span class="hl">📍 抵達 ${Z.name}，由醫師看診。</span>`,
   "若醫師請你去<b>抽血／打針</b>或<b>照 X 光</b>，按下方按鈕，地圖會接著帶你過去。",
   "處置完成後，回<b>急診批價</b>結帳，再從<b>急診入口</b>離開。"
  ];
  t.innerHTML=list(`被分到 ${Z.name}，這樣走：`,steps)+nextBar;
  show(Z.name,"請跟著地圖上的橘色箭頭路線，與下方的文字指引前往。");
}
function clearRoute(){st.zone=null;st.next=null;const t=$("routeTxt");t.style.display="none";t.innerHTML="";
  drawRoute();selStep(S[0]);}
/* ---------- 流程清單 ---------- */
S.forEach(s=>{const li=document.createElement("li");li.dataset.n=s.n;
  li.innerHTML=`<span class="num ${s.back?'back':''}">${s.n}</span><span>${s.t}</span>`;
  li.onclick=()=>selStep(s);$("steps").appendChild(li);});
document.querySelectorAll(".zb[data-z]").forEach(b=>b.onclick=()=>showZone(b.dataset.z));
$("zclr").onclick=clearRoute;
/* ---------- 小人（依地圖座標走動，可隨旋轉更新） ---------- */
const routes={
 patient:[[205,1025],[205,880],[205,792],[130,792],[130,620],[180,620],[180,322],[300,322],[740,322],[755,335],[755,410]],
 nurse:[[262,418],[735,418]],
 nurse2:[[264,600],[264,703],[735,703]],
 upper:[[190,326],[735,326]],
 lobby:[[175,860],[240,860],[240,940]],
 hall:[[140,470],[140,540],[225,540],[225,330]]
};
function mkPath(a){const seg=[];let L=0;for(let i=1;i<a.length;i++){const l=Math.hypot(a[i][0]-a[i-1][0],a[i][1]-a[i-1][1]);seg.push(l);L+=l}return {a,seg,L}}
function at(p,d){d=Math.max(0,Math.min(p.L,d));for(let i=0;i<p.seg.length;i++){if(d<=p.seg[i]||i===p.seg.length-1){const t=p.seg[i]?Math.min(1,d/p.seg[i]):0;
  return [p.a[i][0]+(p.a[i+1][0]-p.a[i][0])*t,p.a[i][1]+(p.a[i+1][1]-p.a[i][1])*t]}d-=p.seg[i]}}
const walkers=[["patient","🚶",48,0],["patient","🧓",44,700],["nurse","👩‍⚕️",52,0],["nurse2","🧑‍⚕️",50,300],["upper","🧑‍⚕️",46,200],["lobby","🚶‍♂️",30,0],["hall","🧒",36,100]]
 .map(([k,e,sp,off])=>({p:mkPath(routes[k]),sp,off,
   g:el("g",{},walkersG,`<ellipse cx="0" cy="3" rx="11" ry="4" fill="#2b5d4a" opacity=".25"/><g class="wbob"><text text-anchor="middle" font-size="30">${e}</text></g>`)}));
const guide=el("g",{style:"display:none"},walkersG,`<ellipse cx="0" cy="3" rx="12" ry="4" fill="#2b5d4a" opacity=".3"/><g class="wbob"><text text-anchor="middle" font-size="34">🚶</text>
  <g transform="translate(0,-48)"><rect x="-34" y="-14" width="68" height="22" rx="11" fill="#fff" stroke="#ff7a45" stroke-width="2.5"/><text text-anchor="middle" y="2" font-size="13" font-weight="800" fill="#ff7a45">跟我走！</text></g></g>`);
let guideT0=0,guideZone=null,guidePath=null,dirty=true;
function frame(now){
  if(Math.abs(target-ang)>0.05){ang+=(target-ang)*0.22;dirty=true}else if(ang!==target){ang=target;dirty=true}
  if(dirty){render();dirty=false}
  const t=now/1000;
  walkers.forEach(w=>{let d=(t*w.sp+w.off)%(2*w.p.L);if(d>w.p.L)d=2*w.p.L-d;const q=at(w.p,d);const s=P(q[0],q[1],6);
    w.g.setAttribute("transform",`translate(${s[0].toFixed(1)},${s[1].toFixed(1)})`)});
  if(st.zone){
    const gk=st.zone+"|"+st.next;
    if(guideZone!==gk){guideZone=gk;guidePath=mkPath(zonePts(st.zone))}
    const d=((now-guideT0)/1000*75)%(guidePath.L+90);const q=at(guidePath,d);const s=P(q[0],q[1],7);
    guide.style.display=guidePath.L<100?"none":"";guide.setAttribute("transform",`translate(${s[0].toFixed(1)},${s[1].toFixed(1)})`);
  }else{guide.style.display="none";guideZone=null}
  requestAnimationFrame(frame);
}
/* ---------- 旋轉控制 ---------- */
$("rotL").onclick=()=>{target+=30};
$("rotR").onclick=()=>{target-=30};
$("rot0").onclick=()=>{let d=((DEF_ANG-ang)%360+540)%360-180;target=ang+d};
let drag=null;
svg.addEventListener("pointerdown",e=>{if(e.pointerType==="touch"||e.button!==0)return;drag={x:e.clientX,a:ang,on:false,id:e.pointerId}});
window.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x;
  if(!drag.on&&Math.abs(dx)>5){drag.on=true;svg.classList.add("drag");try{svg.setPointerCapture(drag.id)}catch(_){}}
  if(drag.on){ang=target=drag.a-dx*0.35;dirty=true;e.preventDefault()}});
window.addEventListener("pointerup",()=>{if(drag&&drag.on)svg.classList.remove("drag");drag=null});
window.addEventListener("pointercancel",()=>{svg.classList.remove("drag");drag=null});
svg.addEventListener("dragstart",e=>e.preventDefault());
show(`第 1 站｜${S[0].t}`,S[0].d);
requestAnimationFrame(frame);
</script>
